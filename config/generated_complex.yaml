stages:
  - name: Ingestion Quality
    type: dq
    rules:
      - id: dq_id_not_null
        type: check_not_null
        column: id
      - id: dq_email_regex
        type: check_regex
        column: email
        pattern: ^[a-z0-9_.+-]+@[a-z0-9-]+\.[a-z0-9-.]+$
      - id: dq_signup_date_regex
        type: check_regex
        column: signup_date
        pattern: ^\d{4}-\d{2}-\d{2}$
  - name: Standardization
    type: cleanse
    rules:
      - type: clean_trim
        column: name
      - type: clean_trim
        column: email
      - type: clean_lowercase
        column: email
      - type: clean_trim
        column: country
      - type: clean_lowercase
        column: country
  - name: Business Logic Verification
    type: dq
    rules:
      - id: dq_name_len
        type: check_length
        column: name
        min_len: 0
        max_len: 50
      - id: dq_email_len
        type: check_length
        column: email
        min_len: 0
        max_len: 100
      - id: dq_age_min
        type: check_min
        column: age
        value: 18
      - id: dq_age_max
        type: check_max
        column: age
        value: 120
      - id: dq_country_valid_set
        type: check_in_set
        column: country
        values:
          - usa
          - uk
          - ca
          - au
          - de
      - id: dq_country_len
        type: check_length
        column: country
        min_len: 0
        max_len: 2
